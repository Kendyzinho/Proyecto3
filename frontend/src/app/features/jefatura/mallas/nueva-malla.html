<h2 mat-dialog-title>Nueva malla</h2>

<form [formGroup]="form" (ngSubmit)="crear()" novalidate>
  <mat-dialog-content class="contenido">
    <p>Se crea en preparación y sin prácticas. La malla vigente sigue rigiendo hasta que publiques la nueva.</p>

    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Malla 2027" />
      @if (form.controls.nombre.hasError('required')) {
        <mat-error>Ingresa el nombre de la malla.</mat-error>
      }
    </mat-form-field>

    @if (error(); as mensaje) {
      <p class="error-general" role="alert">{{ mensaje }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" mat-dialog-close>Cancelar</button>
    <button matButton="filled" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Creando…' : 'Crear malla' }}
    </button>
  </mat-dialog-actions>
</form>
